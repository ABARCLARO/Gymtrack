<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GymTrack — Training Log</title>
<meta name="description" content="A training log with progressive-overload targets, rest timer and progress charts.">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; manifest-src 'self'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0e13">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymTrack">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0e13;--panel:#111820;--panel-2:#0d131a;--line:#1e2a36;--line-soft:#17212b;
    --text:#d6e0e9;--dim:#6a7d8d;--dimmer:#465562;
    --amber:#ffb020;--amber-soft:#3a2c0e;--green:#3fd07a;--green-soft:#0f2a1c;--red:#ff6b6b;--red-soft:#2e1214;
    --mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{padding:0 16px calc(104px + env(safe-area-inset-bottom));max-width:920px;margin:0 auto;line-height:1.5}
  button{font-family:inherit}

  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--dim);
    padding:calc(18px + env(safe-area-inset-top)) 4px 14px;border-bottom:1px solid var(--line-soft);
    margin-bottom:22px;position:sticky;top:0;background:var(--bg);z-index:20}
  .bar .prompt{color:var(--green)}.bar .path{color:var(--dim)}
  .bar .op{color:var(--text);border:none;background:transparent;font-family:var(--mono);font-size:13px;
    border-bottom:1px dashed var(--dimmer);padding:1px 2px;min-width:70px;max-width:120px;outline:none}
  .bar .op:focus{border-bottom-color:var(--amber);color:var(--amber)}
  .bar .spacer{flex:1}
  .bar button{background:transparent;font-family:var(--mono);cursor:pointer;font-size:12px}
  .bar .install{color:var(--amber);border:1px solid var(--amber-soft);border-radius:6px;padding:4px 9px}
  .bar .gear{color:var(--dimmer);border:1px solid var(--line-soft);border-radius:6px;padding:4px 9px}
  .bar .gear:hover,.bar .gear.on{color:var(--text);border-color:var(--line)}

  .brandrow{display:flex;align-items:center;gap:10px;margin:0 2px 16px;flex-wrap:wrap}
  .brandrow .mark{width:38px;height:24px;flex:none}
  .wordmark{font-family:var(--mono);font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
  .wordmark .w2{color:var(--amber)}
  .byline{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--dimmer);border-left:1px solid var(--line);padding-left:10px}
  @media(max-width:400px){.byline{border-left:none;padding-left:0;width:100%;margin-top:-4px}}

  .board{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:640px){.board{grid-template-columns:1fr}}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
  .cell .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
  .scan{position:relative;height:8px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;overflow:hidden;margin-bottom:12px}
  .scan .fill{height:100%;background:linear-gradient(90deg,var(--green),#7ee6ac);transition:width .5s ease}
  .scan .sweep{position:absolute;top:0;bottom:0;width:70px;left:-70px;
    background:linear-gradient(90deg,transparent,rgba(255,176,32,.22),transparent);animation:sweep 3.4s linear infinite}
  @keyframes sweep{0%{left:-70px}100%{left:100%}}
  @media(prefers-reduced-motion:reduce){.scan .sweep{display:none}.scan .fill{transition:none}}
  .scan-meta{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .scan-meta b{color:var(--text);font-weight:600}
  .stat-stack{display:flex;flex-direction:column;gap:14px;justify-content:center;height:100%}
  .stat{display:flex;align-items:baseline;gap:10px}
  .stat .num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
  .stat .unit{font-family:var(--mono);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .stat.flame .num{color:var(--amber)}
  .stat.phase .num{font-size:15px;color:var(--text);font-weight:600}

  .section-tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
    margin:30px 2px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .section-tag::before{content:"";width:6px;height:6px;background:var(--amber);border-radius:50%;flex:none}
  .section-tag.done-tag::before{background:var(--green)}
  .section-tag .spacer{flex:1}

  .switch{display:flex;gap:6px;flex-wrap:wrap}
  .switch button{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:transparent;border:1px solid var(--line);color:var(--dimmer);border-radius:6px;padding:5px 10px;cursor:pointer}
  .switch button.on{color:var(--amber);border-color:var(--amber-soft);background:var(--amber-soft)}
  .switch button.plus{color:var(--dimmer);border-style:dashed}

  .mission{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:10px;padding:22px 20px 20px}
  .mission .wk{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.1em;margin-bottom:4px}
  .mission h2{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px}
  .mission .why{color:var(--dim);font-size:14.5px;margin-bottom:20px;max-width:62ch}
  .tinybtn{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--line-soft);
    color:var(--dimmer);border-radius:6px;padding:3px 8px;cursor:pointer;vertical-align:middle;margin-left:8px}
  .tinybtn:hover{color:var(--amber);border-color:var(--amber-soft)}

  .lift{border-bottom:1px solid var(--line-soft);padding:12px 2px 13px}
  .lift:last-of-type{border-bottom:none}
  .lift-top{display:flex;gap:11px;align-items:baseline}
  .lift .glyph{font-family:var(--mono);font-size:13px;color:var(--dimmer);flex:none;width:16px}
  .lift.on .glyph{color:var(--green)}
  .lift .nm{font-size:14.5px;flex:1}
  .lift.on .nm{color:var(--dim)}
  .lift .tgt{font-family:var(--mono);font-size:11px;color:var(--dimmer);white-space:nowrap}
  .lift .prev{font-family:var(--mono);font-size:11.5px;color:var(--amber);margin:6px 0 0 27px;letter-spacing:.02em}
  .lift .prev.cold{color:var(--dimmer)}
  .lift .pb{color:var(--green)}
  .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
    border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;margin-left:2px;white-space:nowrap}
  .kind.timed{color:var(--green)}
  .kind.bodyweight{color:var(--amber)}
  .kind.carry{color:var(--dim)}

  .sets{display:flex;flex-wrap:wrap;gap:6px;margin:9px 0 0 27px}
  .set{display:flex;align-items:center;gap:3px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:7px;padding:4px 6px}
  .set.beat{border-color:var(--green);background:var(--green-soft)}
  .set input{background:transparent;border:none;color:var(--text);font-family:var(--mono);
    font-size:15px;font-weight:600;text-align:center;outline:none;-moz-appearance:textfield;width:38px}
  .set input.wide{width:46px}
  .set input::-webkit-outer-spin-button,.set input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .set input::placeholder{color:var(--dimmer);font-size:12px}
  .set input:focus{color:var(--amber)}
  .set .x{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .set .suffix{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-left:-1px}
  .set .up{font-family:var(--mono);font-size:11px;color:var(--green)}
  .setctl{display:flex;gap:6px;margin:9px 0 0 27px;flex-wrap:wrap}
  .setctl button{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--line-soft);
    color:var(--dimmer);border-radius:6px;padding:4px 9px;cursor:pointer}
  .setctl button:hover{color:var(--text);border-color:var(--line)}

  .addlift{width:100%;margin-top:14px;font-family:var(--mono);font-size:12px;background:transparent;
    border:1px dashed var(--line);color:var(--dim);border-radius:8px;padding:11px;cursor:pointer}
  .addlift:hover{color:var(--amber);border-color:var(--amber-soft)}

  .subcard{border:1px solid var(--line-soft);border-radius:8px;padding:13px 15px;margin-top:14px;background:var(--panel-2)}
  .subcard .h{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
  .subcard.lab .h{color:var(--green)}.subcard.recall .h{color:var(--amber)}
  .subcard p{font-size:14px}.subcard.recall p{color:var(--dim);font-style:italic}
  .notes{width:100%;margin-top:14px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;
    color:var(--text);font-family:var(--mono);font-size:13px;padding:11px 13px;resize:vertical;min-height:56px;outline:none;line-height:1.6}
  .notes:focus{border-color:var(--line)}.notes::placeholder{color:var(--dimmer)}

  .skills{display:flex;flex-wrap:wrap;gap:7px}
  .skill{font-family:var(--mono);font-size:11.5px;padding:5px 10px;border-radius:20px;border:1px solid var(--line-soft);
    color:var(--dimmer);transition:.2s;cursor:default}
  .skill.on{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
  .skill.pick{cursor:pointer}

  .wkrow{border:1px solid var(--line-soft);border-radius:9px;margin-bottom:6px;overflow:hidden;background:var(--panel-2)}
  .wkrow .head{display:flex;align-items:center;gap:12px;padding:12px 15px;cursor:pointer}
  .wkrow .head:hover{background:var(--panel)}
  .wkrow .glyph{font-family:var(--mono);font-size:13px;flex:none;width:20px;text-align:center;color:var(--green)}
  .wkrow .wname{font-size:14.5px;flex:1}
  .wkrow .wmeta{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .wkrow .chev{color:var(--dimmer);font-family:var(--mono);font-size:12px;transition:transform .2s}
  .wkrow.open .chev{transform:rotate(90deg)}
  .wkrow .body{display:none;padding:2px 15px 16px;border-top:1px solid var(--line-soft)}
  .wkrow.open .body{display:block}
  .wkrow .body .ln{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin:7px 0}
  .wkrow .body .ln b{color:var(--text);font-weight:600}
  .wkrow .body .nt{font-family:var(--mono);font-size:12px;color:var(--dimmer);font-style:italic;margin-top:10px}
  .wkrow .delbtn{font-family:var(--mono);font-size:11px;color:var(--dimmer);background:transparent;
    border:1px solid var(--line-soft);border-radius:6px;padding:5px 10px;cursor:pointer;margin-top:12px}
  .wkrow .delbtn:hover{color:var(--red);border-color:var(--red)}

  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  .chartpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chartpick button{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--line-soft);
    color:var(--dimmer);border-radius:6px;padding:4px 9px;cursor:pointer}
  .chartpick button.on{color:var(--green);border-color:var(--green-soft);background:var(--green-soft)}
  svg.plot{width:100%;height:150px;display:block;overflow:visible}
  .plot .grid{stroke:var(--line-soft);stroke-width:1}
  .plot .ln{fill:none;stroke:var(--amber);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .plot .dot{fill:var(--amber)}
  .plot .dot.pb{fill:var(--green)}
  .plot text{font-family:var(--mono);font-size:9px;fill:var(--dimmer)}
  .plotmeta{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin-top:10px}
  .plotmeta b{color:var(--green)}

  .panel-x{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 18px 16px;margin-bottom:10px}
  .panel-x h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);
    font-weight:500;margin-bottom:12px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--dimmer);margin-bottom:5px}
  .fld input,.fld select{width:100%;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:7px;
    color:var(--text);font-family:var(--mono);font-size:14px;padding:10px 11px;outline:none}
  .fld input:focus,.fld select:focus{border-color:var(--amber)}
  .fld .sub{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);margin-top:5px;line-height:1.6}
  .rowbtns{display:flex;gap:7px;margin-top:14px;flex-wrap:wrap}
  .rowbtns button{font-family:var(--mono);font-size:12px;border-radius:7px;padding:9px 13px;cursor:pointer;border:1px solid var(--line)}
  .rowbtns .ok{background:var(--green);color:#062713;border-color:var(--green);font-weight:700}
  .rowbtns .no{background:transparent;color:var(--dim)}
  .rowbtns .warn{background:transparent;color:var(--red);border-color:var(--red-soft)}
  .hint{font-family:var(--mono);font-size:11px;color:var(--dimmer);line-height:1.7;margin-top:9px}

  .timer{position:fixed;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));max-width:888px;
    margin:0 auto;background:var(--panel);border:1px solid var(--amber-soft);border-radius:10px;
    padding:11px 15px;display:flex;align-items:center;gap:13px;z-index:29}
  .timer .t{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--amber);line-height:1;min-width:78px}
  .timer .t.done{color:var(--green)}
  .timer .lbl{font-family:var(--mono);font-size:11px;color:var(--dim);flex:1;letter-spacing:.08em;text-transform:uppercase}
  .timer button{font-family:var(--mono);font-size:11px;background:transparent;border:1px solid var(--line);
    color:var(--dim);border-radius:6px;padding:6px 10px;cursor:pointer}
  .timer button:hover{color:var(--text)}
  .timer.hold{border-color:var(--green)}
  .timer.hold .t{color:var(--green)}

  .commit{position:fixed;left:0;right:0;bottom:0;background:rgba(10,14,19,.94);backdrop-filter:blur(9px);
    border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));z-index:30}
  .commit .msg{font-family:var(--mono);font-size:11px;color:var(--dim);text-align:center;
    max-width:920px;margin:0 auto 8px;min-height:15px}
  .commit-in{max-width:920px;margin:0 auto;display:flex;gap:8px;align-items:center}
  .commit .go{flex:1;background:var(--green);color:#062713;border:none;border-radius:8px;padding:14px;
    font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
  .commit .alt{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
    padding:14px 12px;font-family:var(--mono);font-size:12px;cursor:pointer}
  .commit .alt:hover{color:var(--amber);border-color:var(--amber-soft)}

  .empty{font-family:var(--mono);font-size:12.5px;color:var(--dimmer);border:1px dashed var(--line-soft);
    border-radius:9px;padding:20px 16px;text-align:center;line-height:1.7}
  .foot{font-family:var(--mono);font-size:12px;color:var(--dimmer);text-align:center;margin-top:36px;line-height:1.8}
  .foot b{color:var(--dim);font-weight:500}
  .loading{text-align:center;color:var(--dim);font-family:var(--mono);padding:60px 0;font-size:13px}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
</style>
</head>
<body>
  <div id="app"><div class="loading">loading your log…</div></div>

<script>
"use strict";

/* ============================ LOG TYPES ============================
   Every exercise declares how a set is measured. The set-entry row, the
   personal-best comparison and the chart all branch on this — nothing
   assumes weight+reps any more. */
const nn=v=>{const n=Number(v);return Number.isFinite(n)?n:0;};
const fmtN=v=>{const n=nn(v);return Number.isInteger(n)?String(n):n.toFixed(1);};
const secs=v=>{const n=Math.round(nn(v));return n<60?n+'s':Math.floor(n/60)+'m'+(n%60?String(n%60).padStart(2,'0'):'');};

const TYPES={
  weighted:{
    name:'Weight + reps', tag:'kg × reps',
    blurb:'Bench, squat, rows, curls — anything where you load a bar, dumbbell or stack.',
    fields:[{k:'w',ph:'kg',max:2000,step:'0.5',mode:'decimal',lbl:'weight in kg'},
            {k:'r',ph:'reps',max:1000,step:'1',mode:'numeric',lbl:'reps'}],
    sep:'×',
    ready:s=>s.w!==''&&s.r!=='',
    fmt:s=>fmtN(s.w)+'×'+fmtN(s.r),
    score:s=>nn(s.w)*nn(s.r),
    metric:s=>nn(s.w)*(1+nn(s.r)/30),
    mLabel:'est. 1RM', mUnit:'kg', vol:s=>nn(s.w)*nn(s.r)
  },
  bodyweight:{
    name:'Reps only (+ optional load)', tag:'reps',
    blurb:'Pull-ups, dips, push-ups, hanging leg raises. Leave the +kg blank until you start adding a belt.',
    fields:[{k:'r',ph:'reps',max:1000,step:'1',mode:'numeric',lbl:'reps'},
            {k:'w',ph:'+kg',max:500,step:'0.5',mode:'decimal',lbl:'added weight in kg',opt:true}],
    sep:'+',
    ready:s=>s.r!=='',
    fmt:s=>fmtN(s.r)+(nn(s.w)?' +'+fmtN(s.w)+'kg':''),
    score:(s,bw)=>(bw+nn(s.w))*nn(s.r),
    metric:(s,bw)=>(bw+nn(s.w))*(1+nn(s.r)/30),
    mLabel:'est. 1RM incl. bodyweight', mUnit:'kg', vol:(s,bw)=>(bw+nn(s.w))*nn(s.r)
  },
  timed:{
    name:'Time only', tag:'seconds',
    blurb:'Isometric holds — side plank, plank, hollow hold, dead hang, wall sit. No load field.',
    fields:[{k:'t',ph:'sec',max:36000,step:'5',mode:'numeric',lbl:'seconds',wide:true}],
    suffix:'s',
    ready:s=>s.t!=='',
    fmt:s=>secs(s.t),
    score:s=>nn(s.t),
    metric:s=>nn(s.t),
    mLabel:'longest hold', mUnit:'s', vol:()=>0
  },
  carry:{
    name:'Weight + distance', tag:'kg × m',
    blurb:"Loaded carries — farmer's carry, suitcase carry, sled push.",
    fields:[{k:'w',ph:'kg',max:2000,step:'0.5',mode:'decimal',lbl:'weight in kg'},
            {k:'d',ph:'m',max:5000,step:'5',mode:'numeric',lbl:'distance in metres'}],
    sep:'×', suffix:'m',
    ready:s=>s.w!==''&&s.d!=='',
    fmt:s=>fmtN(s.w)+'×'+fmtN(s.d)+'m',
    score:s=>nn(s.w)*nn(s.d),
    metric:s=>nn(s.w),
    mLabel:'carry weight', mUnit:'kg', vol:s=>nn(s.w)*nn(s.d)
  }
};
const KINDS=Object.keys(TYPES);
const T=k=>TYPES[k]||TYPES.weighted;
const FIELDKEYS=['w','r','t','d'];

const MUSCLES=["chest","upper-chest","front-delts","side-delts","rear-delts","triceps","lats","traps",
  "biceps","forearms","quads","hamstrings","glutes","calves","abs","obliques"];

/* ============================ DEFAULT PROGRAM ============================ */
function defaultProgram(){return [
  {id:'push',label:'Push',slot:'TUE',title:'Chest · Shoulders · Triceps',
    why:"Everything that presses, trained together. Your triceps and front delts already assist every chest press — hitting them the same day means they get fatigued once a week, not twice.",
    cue:"Heavy chest first, triceps last. Reverse the order and your bench suffers for nothing.",
    lifts:[
      {n:"Bench press",t:"4 × 6–10",s:4,k:'weighted',m:["chest","front-delts","triceps"]},
      {n:"Incline dumbbell press",t:"3 × 8–12",s:3,k:'weighted',m:["upper-chest","front-delts"]},
      {n:"Dip",t:"3 × 8–12",s:3,k:'bodyweight',m:["chest","triceps"]},
      {n:"Cable fly",t:"3 × 12–15",s:3,k:'weighted',m:["chest"]},

/* Exercises renamed across versions — session history follows the new name
   so personal bests survive the rename. */
const RENAMES={
  'Barbell curl':'Dumbbell curl',
  'Wrist curl + reverse':'Wrist curl',
  'Dip or decline press':'Dip',
  'Pull-up or lat pulldown':'Lat pulldown'
};
/* Best guess at the log type of a name we have history for but no exercise card. */
function guessKind(name){
  const n=(name||'').toLowerCase();
  if(/carry|sled|suitcase|farmer/.test(n))return 'carry';
  if(/plank|\bhold\b|dead ?hang|\bhang\b|wall sit|isometric|l-?sit|bridge/.test(n))return 'timed';
  /* a cable or machine version of a bodyweight movement is loaded, not bodyweight */
  if(/cable|machine|smith|landmine|barbell/.test(n))return 'weighted';
  /* rep-based movements — "hanging leg raise" must not match the hang hold above */
  if(/pull-?up|chin-?up|push-?up|press-?up|\bdip\b|leg raise|knee raise|muscle-?up|sit-?up|crunch|inverted row/.test(n))return 'bodyweight';
  return 'weighted';
}

/* ============================ STATE ============================ */
const KEY='gymtrack:v3';
const OLD_KEYS=['gymtrack:v2','gymtrack:v1'];
const MAXLEN={name:60,target:24,operator:24,notes:2000};

let S=null;
let ui={panel:null,edit:null,chartLift:null,flash:'',openSession:null};
let rest={left:0,total:0,handle:null,mode:'rest'};

function freshState(){return{
  v:3,operator:'operator',bodyKg:70,program:defaultProgram(),sessions:[],draft:{},notes:'',
  day:'push',restSec:150,openSession:null
};}

const clampStr=(v,max)=>typeof v==='string'?v.slice(0,max):'';
const num=(v,lo,hi,d)=>{const n=Number(v);return Number.isFinite(n)&&n>=lo&&n<=hi?n:d;};

function cleanLift(l){
  if(!l||typeof l!=='object')return null;
  const n=clampStr(l.n,MAXLEN.name).trim();if(!n)return null;
  return{n,t:clampStr(l.t,MAXLEN.target)||'3 × 8–12',s:num(l.s,1,12,3),
    k:KINDS.indexOf(l.k)>=0?l.k:guessKind(n),
    m:Array.isArray(l.m)?l.m.filter(x=>MUSCLES.indexOf(x)>=0).slice(0,6):[]};
}
function cleanDay(d,i){
  if(!d||typeof d!=='object')return null;
  const label=clampStr(d.label,24).trim()||('Day '+(i+1));
  const lifts=(Array.isArray(d.lifts)?d.lifts:[]).map(cleanLift).filter(Boolean).slice(0,40);
  return{id:clampStr(d.id,24)||('day'+i+'_'+Math.random().toString(36).slice(2,7)),
    label,slot:clampStr(d.slot,8),title:clampStr(d.title,80),
    why:clampStr(d.why,600),cue:clampStr(d.cue,400),lifts};
}
function cleanRow(x){
  if(!x||typeof x!=='object')return null;
  const out={};let any=false;
  FIELDKEYS.forEach(k=>{
    if(x[k]===undefined||x[k]===null||x[k]==='')return;
    const v=num(x[k],0,36000,null);
    if(v!==null){out[k]=v;any=true;}
  });
  return any?out:null;
}
/* Everything before v3 stored {w,r} whatever the exercise really was. When the
   kind says otherwise, move the number to the field it belongs in rather than
   dropping it — a 45-second side plank was typed into the reps box. */
function reshape(kind,row){
  const has=k=>row[k]!==undefined;
  if(kind==='timed'&&!has('t')){
    if(has('r'))return{t:row.r};
    if(has('w'))return{t:row.w};
    return null;
  }
  if(kind==='carry'&&!has('d')&&has('r'))return{w:row.w!==undefined?row.w:0,d:row.r};
  const out={};
  T(kind).fields.forEach(f=>{if(has(f.k))out[f.k]=row[f.k];});
  return Object.keys(out).length?out:null;
}
/* entries: { "Bench press": {k:'weighted', sets:[{w,r},…]} } */
function cleanEntry(v,name){
  let kind,rows;
  if(Array.isArray(v)){kind=guessKind(name);rows=v;}
  else if(v&&typeof v==='object'){kind=KINDS.indexOf(v.k)>=0?v.k:guessKind(name);rows=Array.isArray(v.sets)?v.sets:[];}
  else return null;
  const sets=rows.slice(0,20).map(cleanRow).filter(Boolean).map(r=>reshape(kind,r)).filter(Boolean);
  return sets.length?{k:kind,sets}:null;
}
function cleanSession(s){
  if(!s||typeof s!=='object')return null;
  const ts=num(s.ts,0,8.64e15,0);if(!ts)return null;
  const entries={};
  if(s.entries&&typeof s.entries==='object'){
    Object.keys(s.entries).slice(0,60).forEach(k=>{
      let name=clampStr(k,MAXLEN.name);if(!name)return;
      if(RENAMES[name])name=RENAMES[name];
      const e=cleanEntry(s.entries[k],name);
      if(e)entries[name]=e;
    });
  }
  if(!Object.keys(entries).length)return null;
  return{ts,date:clampStr(s.date,24),day:clampStr(s.day,24),entries,notes:clampStr(s.notes,MAXLEN.notes)};
}
function cleanState(raw){
  const f=freshState();
  if(!raw||typeof raw!=='object')return f;
  const prog=(Array.isArray(raw.program)?raw.program:[]).map(cleanDay).filter(Boolean).slice(0,12);
  f.program=prog.length?prog:defaultProgram();
  f.operator=clampStr(raw.operator,MAXLEN.operator).trim()||'operator';
  f.bodyKg=num(raw.bodyKg,20,400,70);
  f.sessions=(Array.isArray(raw.sessions)?raw.sessions:[]).map(cleanSession).filter(Boolean).slice(0,5000);
  f.notes=clampStr(raw.notes,MAXLEN.notes);
  f.restSec=num(raw.restSec,15,900,150);
  f.draft=(raw.draft&&typeof raw.draft==='object')?raw.draft:{};
  f.day=f.program.some(d=>d.id===raw.day)?raw.day:f.program[0].id;
  return f;
}
/* An older saved program still carries the old names and no log types.
   Patch those two things without touching anything the user has customised. */
function upgradeProgram(p){
  p.forEach(d=>d.lifts.forEach(l=>{
    if(RENAMES[l.n])l.n=RENAMES[l.n];
    if(KINDS.indexOf(l.k)<0)l.k=guessKind(l.n);
  }));
  return p;
}

function load(){
  let raw=null;
  try{const s=localStorage.getItem(KEY);if(s)raw=JSON.parse(s);}catch(e){}
  if(!raw){
    for(const k of OLD_KEYS){
      try{const o=localStorage.getItem(k);if(o){raw=JSON.parse(o);break;}}catch(e){}
    }
  }
  S=cleanState(raw);
  S.program=upgradeProgram(S.program);
  S.draft=sanitiseDraft(S.draft);
}
function sanitiseDraft(d){
  const out={};
  Object.keys(d||{}).slice(0,12).forEach(dayId=>{
    const day=dayById(dayId);if(!day)return;
    const inner={};
    Object.keys(d[dayId]||{}).slice(0,60).forEach(n=>{
      const lift=day.lifts.find(l=>l.n===n);if(!lift)return;
      const rows=Array.isArray(d[dayId][n])?d[dayId][n]:[];
      inner[n]=rows.slice(0,20).map(x=>blankRow(lift.k,x));
    });
    out[dayId]=inner;
  });
  return out;
}
function blankRow(kind,seed){
  const r={};
  T(kind).fields.forEach(f=>{r[f.k]=seed&&seed[f.k]!=null?clampStr(String(seed[f.k]),6):'';});
  return r;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){ui.flash='storage full or blocked — export your log';}}

/* ============================ DERIVED ============================ */
const dayById=id=>S.program.find(d=>d.id===id)||S.program[0];
const curDay=()=>dayById(S.day);
function nextDayId(){
  const last=[...S.sessions].sort((a,b)=>b.ts-a.ts)[0];
  const ids=S.program.map(d=>d.id);
  if(!last||ids.indexOf(last.day)<0)return ids[0];
  return ids[(ids.indexOf(last.day)+1)%ids.length];
}
const lastFor=id=>S.sessions.filter(s=>s.day===id).sort((a,b)=>b.ts-a.ts)[0]||null;
const scoreOf=(kind,set)=>T(kind).score(set,S.bodyKg);
function bestEver(dayId,name){
  let best=null;
  S.sessions.filter(s=>s.day===dayId).forEach(s=>{
    const e=s.entries[name];if(!e)return;
    e.sets.forEach(x=>{if(!best||scoreOf(e.k,x)>scoreOf(best.k,best.set))best={k:e.k,set:x};});
  });
  return best;
}
function cycleDone(){
  const cut=Date.now()-7*864e5;
  return S.program.filter(d=>S.sessions.some(s=>s.day===d.id&&s.ts>cut)).length;
}
function musclesHit(){
  const cut=Date.now()-7*864e5,set=new Set();
  S.sessions.filter(s=>s.ts>cut).forEach(s=>{
    const d=dayById(s.day);if(!d)return;
    Object.keys(s.entries).forEach(n=>{const l=d.lifts.find(x=>x.n===n);if(l)l.m.forEach(m=>set.add(m));});
  });
  return set;
}
function sessionVolume(s){
  return Object.values(s.entries).reduce((a,e)=>
    a+e.sets.reduce((b,x)=>b+T(e.k).vol(x,S.bodyKg),0),0);
}
function draftFor(id){
  if(!S.draft[id])S.draft[id]={};
  const d=dayById(id),dr=S.draft[id];
  d.lifts.forEach(l=>{
    if(!Array.isArray(dr[l.n]))dr[l.n]=Array.from({length:l.s},()=>blankRow(l.k));
    else dr[l.n]=dr[l.n].map(x=>blankRow(l.k,x)); /* keeps rows valid if the type changed */
  });
  Object.keys(dr).forEach(k=>{if(!d.lifts.some(l=>l.n===k))delete dr[k];});
  return dr;
}

/* ============================ ESCAPING ============================ */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

  b.hidden=!(!standalone&&(deferredPrompt||isIOS));

/* ============================ TIMERS ============================
   Two modes: counting down between sets, and counting up during a
   timed hold so you can log the seconds you actually managed. */
function startRest(sec){
  stopTimer();rest.mode='rest';rest.total=sec;rest.left=sec;
  rest.handle=setInterval(()=>{
    rest.left--;
    if(rest.left<=0){rest.left=0;clearInterval(rest.handle);rest.handle=null;chime();}
    paintTimer();
  },1000);
  paintTimer();
}
function startHold(){
  stopTimer();rest.mode='hold';rest.left=0;rest.total=0;
  rest.handle=setInterval(()=>{rest.left++;paintTimer();},1000);
  paintTimer();
}
function stopTimer(){if(rest.handle)clearInterval(rest.handle);rest.handle=null;rest.left=0;rest.total=0;rest.mode='rest';paintTimer();}
function chime(){
  try{if(navigator.vibrate)navigator.vibrate([180,90,180]);}catch(e){}
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    const a=new C(),o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=880;g.gain.value=.001;
    o.connect(g);g.connect(a.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.1);
    o.stop(a.currentTime+1.15);setTimeout(()=>a.close().catch(()=>{}),1400);
  }catch(e){}
}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function paintTimer(){
  const host=document.getElementById('timer');if(!host)return;
  if(!rest.handle&&!rest.total&&rest.mode!=='hold'){host.innerHTML='';return;}
  if(rest.mode==='hold'){
    host.innerHTML=`<div class="timer hold"><span class="t">${mmss(rest.left)}</span>
      <span class="lbl">holding — tap stop to log</span>
      <button id="holdstop">stop</button></div>`;
    const b=document.getElementById('holdstop');
    if(b)b.onclick=()=>{
      const sec=rest.left,tgt=ui.holdTarget;stopTimer();
      if(tgt){
        const d=curDay(),lift=d.lifts[tgt.x];
        if(lift){const row=draftFor(d.id)[lift.n][tgt.i];if(row){row.t=String(sec);save();}}
      }
      ui.holdTarget=null;ui.flash='logged '+secs(sec)+' hold';render();
    };
    return;
  }
  const done=rest.left===0;
  host.innerHTML=`<div class="timer">
    <span class="t ${done?'done':''}">${done?'GO':mmss(rest.left)}</span>
    <span class="lbl">${done?'rest over — next set':'resting'}</span>
    <button id="rest30">+30s</button><button id="restx">skip</button></div>`;
  const a=document.getElementById('rest30'),b=document.getElementById('restx');
  if(a)a.onclick=()=>{rest.left+=30;rest.total+=30;if(!rest.handle)startRest(rest.left);paintTimer();};
  if(b)b.onclick=stopTimer;
}

function setCell(lift,i,j,row,pb){
  const ty=T(lift.k);
  const beat=pb&&ty.ready(row)&&scoreOf(lift.k,{
    w:nn(row.w),r:nn(row.r),t:nn(row.t),d:nn(row.d)})>scoreOf(pb.k,pb.set);
  const inputs=ty.fields.map((f,fi)=>{
    const sep=fi>0?`<span class="x">${ty.sep||''}</span>`:'';
    return sep+`<input type="number" inputmode="${f.mode}" placeholder="${escAttr(f.ph)}" min="0" max="${f.max}" step="${f.step}"
      value="${escAttr(row[f.k]!=null?row[f.k]:'')}" data-x="${i}" data-i="${j}" data-f="${f.k}"
      class="${f.wide?'wide':''}" aria-label="${escAttr(lift.n)} set ${j+1} ${f.lbl}">`;
  }).join('');
  return `<span class="set ${beat?'beat':''}">${inputs}${ty.suffix?`<span class="suffix">${ty.suffix}</span>`:''}${beat?'<span class="up">▲</span>':''}</span>`;
}

function liftRow(d,l,i,dr){
  const ty=T(l.k),rows=dr[l.n]||[];
  const filled=rows.some(s=>ty.ready(s));
  const prev=lastFor(d.id),pe=prev&&prev.entries[l.n];
  const g=pe?pe.sets.map(x=>T(pe.k).fmt(x)).join('  '):null;
  const pb=bestEver(d.id,l.n);
  return `<div class="lift ${filled?'on':''}">
    <div class="lift-top">
      <span class="glyph">${filled?'✓':String(i+1).padStart(2,'0')}</span>
      <span class="nm">${esc(l.n)}</span>
      ${l.k!=='weighted'?`<span class="kind ${esc(l.k)}">${esc(ty.tag)}</span>`:''}
      <span class="tgt">${esc(l.t)}</span>
    </div>
    <div class="prev ${g?'':'cold'}">${g?'last: '+esc(g):'no previous data'}${pb?` <span class="pb">· pb ${esc(T(pb.k).fmt(pb.set))}</span>`:''}</div>
    <div class="sets">${rows.map((s,j)=>setCell(l,i,j,s,pb)).join('')}</div>
    <div class="setctl">
      <button data-add="${i}">+ set</button>
      ${rows.length>1?`<button data-rm="${i}">− set</button>`:''}
      ${l.k==='timed'?`<button data-hold="${i}">⏱ time a hold</button>`:''}
      <button data-edit="${i}">edit</button>
    </div>
  </div>`;
}

/* ---- charts ---- */
function liftHistory(name){
  return S.sessions.filter(s=>s.entries[name]).sort((a,b)=>a.ts-b.ts).map(s=>{
    const e=s.entries[name],ty=T(e.k);
    const top=e.sets.reduce((a,x)=>(scoreOf(e.k,x)>scoreOf(e.k,a)?x:a));
    return{ts:s.ts,date:s.date,k:e.k,top,metric:ty.metric(top,S.bodyKg),
      label:ty.fmt(top),mLabel:ty.mLabel,mUnit:ty.mUnit};
  });
}
function chartCard(){
  const logged=[...new Set(S.sessions.flatMap(s=>Object.keys(s.entries)))];
  if(!logged.length)return `<div class="empty">no data yet — commit a session and your progress curve starts here</div>`;
  if(!ui.chartLift||logged.indexOf(ui.chartLift)<0)ui.chartLift=logged[0];
  const h=liftHistory(ui.chartLift);
  return `<div class="chartcard">
    <div class="chartpick">${logged.slice(0,24).map(n=>
      `<button data-chart="${escAttr(n)}" class="${n===ui.chartLift?'on':''}">${esc(n)}</button>`).join('')}</div>
    ${plotSVG(h)}${plotMeta(h)}</div>`;
}
function plotSVG(h){
  if(h.length<2)return `<div class="empty">one session logged — the curve needs at least two</div>`;
  const W=600,H=150,pad=26;
  const ys=h.map(p=>p.metric),lo=Math.min(...ys),hi=Math.max(...ys);
  const span=(hi-lo)||1,minY=lo-span*.18,maxY=hi+span*.18;
  const X=i=>pad+(i/(h.length-1))*(W-pad*2);
  const Y=v=>H-pad-((v-minY)/(maxY-minY))*(H-pad*2);
  const pts=h.map((p,i)=>[X(i),Y(p.metric)]);
  const best=Math.max(...ys),unit=h[h.length-1].mUnit;
  return `<svg class="plot" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${escAttr(h[h.length-1].mLabel)} over time">
    <line class="grid" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>
    <line class="grid" x1="${pad}" y1="${pad}" x2="${W-pad}" y2="${pad}"/>
    <polyline class="ln" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>
    ${pts.map((p,i)=>`<circle class="dot ${h[i].metric===best?'pb':''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5"/>`).join('')}
    <text x="${pad}" y="${pad-8}">${maxY.toFixed(0)} ${esc(unit)}</text>
    <text x="${pad}" y="${H-pad+14}">${esc(h[0].date)}</text>
    <text x="${W-pad}" y="${H-pad+14}" text-anchor="end">${esc(h[h.length-1].date)}</text>
  </svg>`;
}
function plotMeta(h){
  if(!h.length)return '';
  const f=h[0],l=h[h.length-1];
  const dv=l.metric-f.metric,pct=f.metric?(dv/f.metric)*100:0;
  return `<div class="plotmeta">top set now <b>${esc(l.label)}</b> · ${esc(l.mLabel)} ${l.metric.toFixed(1)} ${esc(l.mUnit)}
    ${h.length>1?`· ${dv>=0?'up':'down'} <b>${Math.abs(dv).toFixed(1)} ${esc(l.mUnit)} (${Math.abs(pct).toFixed(0)}%)</b> since ${esc(f.date)}`:''}</div>`;
}

function histHTML(){
  const list=[...S.sessions].sort((a,b)=>b.ts-a.ts).slice(0,60);
  if(!list.length)return `<div class="empty">nothing committed yet.<br>log today and next week you'll have a number to beat.</div>`;
  return list.map(s=>{
    const open=ui.openSession===s.ts,vol=sessionVolume(s),d=S.program.find(p=>p.id===s.day);
    return `<div class="wkrow ${open?'open':''}">
      <div class="head" data-t="${s.ts}"><span class="glyph">✓</span>
        <span class="wname">${esc(d?d.label:s.day)} day</span>
        <span class="wmeta">${esc(s.date)}${vol?' · '+Math.round(vol)+' kg':''}</span><span class="chev">▸</span></div>
      <div class="body">
        ${Object.keys(s.entries).map(k=>{const e=s.entries[k];
          return `<div class="ln"><b>${esc(k)}</b> — ${esc(e.sets.map(x=>T(e.k).fmt(x)).join(', '))}</div>`;}).join('')}
        ${s.notes?`<div class="nt">${esc(s.notes)}</div>`:''}
        <button class="delbtn" data-del="${s.ts}">delete session</button>
      </div></div>`;
  }).join('');
}

/* ---- panels ---- */
function settingsPanel(){
  return `<div class="panel-x"><h3>Settings</h3>
    <div class="fld"><label>Rest timer (seconds)</label>
      <input id="setrest" type="number" min="15" max="900" step="15" value="${escAttr(S.restSec)}"></div>
    <div class="fld"><label>Bodyweight (kg)</label>
      <input id="setbw" type="number" min="20" max="400" step="0.5" value="${escAttr(S.bodyKg)}">
      <div class="sub">Used to score bodyweight exercises, so 12 pull-ups can be compared against 8 with a 10 kg belt.</div></div>
    <div class="rowbtns">
      <button class="ok" id="setsave">save</button>
      <button class="no" id="expo">export log</button>
      <button class="no" id="impo">import log</button>
      <button class="warn" id="wipe">reset everything</button>
      <button class="no" id="setclose">close</button>
    </div>
    <input type="file" id="impfile" accept="application/json,.json" hidden>
    <p class="hint">Export writes a JSON file of every session — keep one somewhere safe. Clearing your browser data wipes this log, and reinstalling the app will not bring it back.</p>
  </div>`;
}
function dayPanel(){
  const e=ui.edit||{},isNew=!e.id;
  const d=isNew?{label:'',slot:'',title:''}:dayById(e.id);
  return `<div class="panel-x"><h3>${isNew?'New training day':'Edit '+esc(d.label)+' day'}</h3>
    <div class="fld"><label>Name</label><input id="dlabel" maxlength="24" value="${escAttr(d.label)}" placeholder="Push"></div>
    <div class="fld"><label>Slot (optional)</label><input id="dslot" maxlength="8" value="${escAttr(d.slot||'')}" placeholder="TUE"></div>
    <div class="fld"><label>Subtitle (optional)</label><input id="dtitle" maxlength="80" value="${escAttr(d.title||'')}" placeholder="Chest · Shoulders · Triceps"></div>
    <div class="rowbtns">
      <button class="ok" id="dsave">${isNew?'create day':'save'}</button>
      <button class="no" id="dcancel">cancel</button>
      ${!isNew&&S.program.length>1?`<button class="warn" id="ddel">delete day</button>`:''}
    </div></div>`;
}
function liftPanel(){
  const e=ui.edit||{},isNew=e.idx==null,d=curDay();
  const l=isNew?{n:'',t:'3 × 8–12',s:3,k:'weighted',m:[]}:d.lifts[e.idx];
  if(!l)return '';
  const picked=e.m||l.m.slice(),kind=e.k||l.k;
  return `<div class="panel-x"><h3>${isNew?'Add exercise to '+esc(d.label):'Edit exercise'}</h3>
    <div class="fld"><label>Name</label><input id="lname" maxlength="60" value="${escAttr(l.n)}" placeholder="Incline dumbbell press"></div>
    <div class="fld"><label>How a set is measured</label>
      <select id="lkind">${KINDS.map(k=>`<option value="${escAttr(k)}" ${k===kind?'selected':''}>${esc(TYPES[k].name)}</option>`).join('')}</select>
      <div class="sub" id="kindblurb">${esc(T(kind).blurb)}</div></div>
    <div class="fld"><label>Target</label><input id="ltgt" maxlength="24" value="${escAttr(l.t)}" placeholder="3 × 8–12"></div>
    <div class="fld"><label>Sets</label><input id="lsets" type="number" min="1" max="12" value="${escAttr(l.s)}"></div>
    <div class="fld"><label>Muscles worked</label>
      <div class="skills" id="mpick">${MUSCLES.map(m=>
        `<span class="skill pick ${picked.indexOf(m)>=0?'on':''}" data-m="${escAttr(m)}">${m}</span>`).join('')}</div></div>
    <div class="rowbtns">
      <button class="ok" id="lsave">${isNew?'add exercise':'save'}</button>
      <button class="no" id="lcancel">cancel</button>
      ${!isNew?`<button class="warn" id="ldel">remove</button>`:''}
      ${!isNew&&e.idx>0?`<button class="no" id="lup">move up</button>`:''}
      ${!isNew&&e.idx<d.lifts.length-1?`<button class="no" id="ldown">move down</button>`:''}
    </div>
    <p class="hint">Changing how a set is measured clears any unsaved sets for this exercise. Sessions already committed keep the format they were logged in.</p>
  </div>`;
}

/* ============================ EXPORT / IMPORT ============================ */
function exportLog(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='gymtrack-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  ui.flash='log exported';render();
}
function importLog(file){
  if(!file)return;
  if(file.size>5*1024*1024){ui.flash='file too large';render();return;}
  const fr=new FileReader();
  fr.onload=()=>{
    let raw;try{raw=JSON.parse(String(fr.result));}catch(e){ui.flash='not a valid gymtrack file';render();return;}
    const inc=cleanState(raw);
    if(!confirm('Import '+inc.sessions.length+' sessions? This replaces the log currently on this device.'))return;
    S=inc;S.program=upgradeProgram(S.program);S.draft=sanitiseDraft(S.draft);
    save();ui.panel=null;ui.flash='imported '+S.sessions.length+' sessions';render();
  };
  fr.onerror=()=>{ui.flash='could not read that file';render();};
  fr.readAsText(file);
}

/* ============================ WIRE ============================ */
const on=(id,ev,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,fn);};

function wire(){
  on('op','change',e=>{S.operator=clampStr(e.target.value,MAXLEN.operator).trim()||'operator';save();render();});
  on('gear','click',()=>{ui.panel=ui.panel==='settings'?null:'settings';render();});
  on('install','click',async()=>{
    if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;refreshInstall();}
    else alert('On iPhone: tap Share, then "Add to Home Screen".');
  });

  on('setsave','click',()=>{
    S.restSec=num((document.getElementById('setrest')||{}).value,15,900,150);
    S.bodyKg=num((document.getElementById('setbw')||{}).value,20,400,70);
    save();ui.flash='saved — rest '+mmss(S.restSec)+', bodyweight '+S.bodyKg+' kg';render();});
  on('setclose','click',()=>{ui.panel=null;render();});
  on('expo','click',exportLog);
  on('impo','click',()=>{const f=document.getElementById('impfile');if(f)f.click();});
  on('impfile','change',e=>{importLog(e.target.files&&e.target.files[0]);e.target.value='';});
  on('wipe','click',()=>{
    const n=S.sessions.length;
    const typed=prompt('This deletes all '+n+' logged session'+(n===1?'':'s')+' permanently.\n\nExport first if you want a backup.\n\nType DELETE to confirm:');
    if(typed===null)return;
    if(typed.trim().toUpperCase()!=='DELETE'){ui.flash='reset cancelled — nothing was deleted';render();return;}
    const op=S.operator,bw=S.bodyKg;S=freshState();S.operator=op;S.bodyKg=bw;
    save();ui.panel=null;ui.flash='log wiped';render();
  });

  document.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{
    S.day=b.dataset.day;ui.panel=null;save();render();}));
  on('adddayb','click',()=>{ui.edit={};ui.panel='day';render();});
  on('editday','click',()=>{ui.edit={id:S.day};ui.panel='day';render();});
  on('dsave','click',()=>{
    const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
    const label=clampStr(g('dlabel'),24).trim();
    if(!label){ui.flash='a day needs a name';render();return;}
    const patch={label,slot:clampStr(g('dslot'),8).trim(),title:clampStr(g('dtitle'),80).trim()};
    if(ui.edit&&ui.edit.id)Object.assign(dayById(ui.edit.id),patch);
    else{
      if(S.program.length>=12){ui.flash='twelve days is the limit';render();return;}
      const id='d'+Date.now().toString(36);
      S.program.push(Object.assign({id,why:'',cue:'',lifts:[]},patch));S.day=id;
    }
    ui.panel=null;ui.edit=null;save();render();
  });
  on('dcancel','click',()=>{ui.panel=null;ui.edit=null;render();});
  on('ddel','click',()=>{
    const d=dayById(ui.edit.id);
    if(!confirm('Remove the '+d.label+' day? Logged sessions are kept.'))return;
    S.program=S.program.filter(x=>x.id!==d.id);delete S.draft[d.id];
    S.day=S.program[0].id;ui.panel=null;ui.edit=null;save();render();
  });

  on('addlift','click',()=>{ui.edit={m:[],k:'weighted'};ui.panel='lift';render();});
  document.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{
    const idx=Number(b.dataset.edit),l=curDay().lifts[idx];
    ui.edit={idx,m:l.m.slice(),k:l.k};ui.panel='lift';render();}));
  on('lkind','change',e=>{
    if(ui.edit)ui.edit.k=KINDS.indexOf(e.target.value)>=0?e.target.value:'weighted';
    const b=document.getElementById('kindblurb');
    if(b)b.textContent=T(ui.edit?ui.edit.k:'weighted').blurb;
  });
  document.querySelectorAll('#mpick .skill').forEach(c=>c.addEventListener('click',()=>{
    if(!ui.edit)return;
    const m=c.dataset.m,arr=ui.edit.m||(ui.edit.m=[]),i=arr.indexOf(m);
    if(i>=0)arr.splice(i,1);else if(arr.length<6)arr.push(m);
    c.classList.toggle('on',arr.indexOf(m)>=0);
  }));
  on('lsave','click',()=>{
    const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
    const d=curDay(),e=ui.edit||{};
    const n=clampStr(g('lname'),MAXLEN.name).trim();
    if(!n){ui.flash='an exercise needs a name';render();return;}
    if(d.lifts.some((l,i)=>l.n.toLowerCase()===n.toLowerCase()&&i!==e.idx)){
      ui.flash='that exercise is already on this day';render();return;}
    const kind=KINDS.indexOf(g('lkind'))>=0?g('lkind'):'weighted';
    const lift={n,t:clampStr(g('ltgt'),MAXLEN.target).trim()||'3 × 8–12',s:num(g('lsets'),1,12,3),k:kind,m:(e.m||[]).slice(0,6)};
    if(e.idx==null){
      if(d.lifts.length>=40){ui.flash='forty exercises is the limit';render();return;}
      d.lifts.push(lift);
    }else{
      const old=d.lifts[e.idx],dr=S.draft[d.id];
      d.lifts[e.idx]=lift;
      if(dr){
        if(old.k!==kind)delete dr[old.n];               /* measurement changed — old rows no longer apply */
        else if(old.n!==n){dr[n]=dr[old.n];delete dr[old.n];}
      }
    }
    ui.panel=null;ui.edit=null;save();render();
  });
  on('lcancel','click',()=>{ui.panel=null;ui.edit=null;render();});
  on('ldel','click',()=>{
    const d=curDay(),i=ui.edit.idx;
    if(!confirm('Remove "'+d.lifts[i].n+'" from '+d.label+'?'))return;
    d.lifts.splice(i,1);ui.panel=null;ui.edit=null;save();render();
  });
  const swap=(i,j)=>{const d=curDay(),t=d.lifts[i];d.lifts[i]=d.lifts[j];d.lifts[j]=t;ui.edit.idx=j;save();render();};
  on('lup','click',()=>swap(ui.edit.idx,ui.edit.idx-1));
  on('ldown','click',()=>swap(ui.edit.idx,ui.edit.idx+1));

  /* set inputs — keyed by index, so an exercise name never reaches a selector */
  document.querySelectorAll('.sets input').forEach(inp=>inp.addEventListener('input',e=>{
    const t=e.target,d=curDay(),lift=d.lifts[Number(t.dataset.x)];
    if(!lift)return;
    const rows=draftFor(d.id)[lift.n],row=rows[Number(t.dataset.i)];
    if(!row||!(t.dataset.f in row))return;
    row[t.dataset.f]=clampStr(t.value,6);
    save();
    const ty=T(lift.k),cell=t.closest('.set'),pb=bestEver(d.id,lift.n);
    const beat=pb&&ty.ready(row)&&scoreOf(lift.k,row)>scoreOf(pb.k,pb.set);
    cell.classList.toggle('beat',!!beat);
    let up=cell.querySelector('.up');
    if(beat&&!up){up=document.createElement('span');up.className='up';up.textContent='▲';cell.appendChild(up);}
    if(!beat&&up)up.remove();
    const box=t.closest('.lift');
    if(box){
      const anyDone=rows.some(r=>ty.ready(r));
      box.classList.toggle('on',anyDone);
      box.querySelector('.glyph').textContent=anyDone?'✓':String(Number(t.dataset.x)+1).padStart(2,'0');
    }
    /* start the rest clock once the set is complete, whatever its shape */
    if(ty.ready(row)&&S.restSec&&t.dataset.f===ty.fields[ty.fields.length-1].k)startRest(S.restSec);
  }));
  document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>{
    const d=curDay(),l=d.lifts[Number(b.dataset.add)],rows=draftFor(d.id)[l.n];
    if(rows.length<20)rows.push(blankRow(l.k));save();render();}));
  document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{
    const d=curDay(),l=d.lifts[Number(b.dataset.rm)],rows=draftFor(d.id)[l.n];
    if(rows.length>1)rows.pop();save();render();}));
  document.querySelectorAll('[data-hold]').forEach(b=>b.addEventListener('click',()=>{
    const x=Number(b.dataset.hold),d=curDay(),l=d.lifts[x],rows=draftFor(d.id)[l.n];
    let i=rows.findIndex(r=>r.t==='');if(i<0)i=rows.length-1;
    ui.holdTarget={x,i};startHold();
  }));

  on('notes','input',e=>{S.notes=clampStr(e.target.value,MAXLEN.notes);save();});
  document.querySelectorAll('[data-chart]').forEach(b=>b.addEventListener('click',()=>{
    ui.chartLift=b.dataset.chart;render();}));

  on('restb','click',()=>{rest.handle?stopTimer():startRest(S.restSec);});
  on('copy','click',()=>{
    const d=curDay(),s=lastFor(d.id);
    if(!s){ui.flash='no previous '+d.label.toLowerCase()+' session to copy';render();return;}
    const dr=draftFor(d.id);let n=0;
    d.lifts.forEach(l=>{
      const e=s.entries[l.n];
      if(e&&e.k===l.k){dr[l.n]=e.sets.map(x=>blankRow(l.k,x));n++;}
    });
    ui.flash=n?'last session copied — now change what you\u2019re beating':'nothing from last session matches this card';
    save();render();
  });
  on('go','click',()=>{
    const d=curDay(),dr=draftFor(d.id),entries={};let n=0;
    d.lifts.forEach(l=>{
      const ty=T(l.k);
      const sets=(dr[l.n]||[]).filter(s=>ty.ready(s)).map(s=>{
        const o={};ty.fields.forEach(f=>{const v=num(s[f.k],0,f.max,0);if(v||!f.opt)o[f.k]=v;});return o;});
      if(sets.length){entries[l.n]={k:l.k,sets};n+=sets.length;}
    });
    if(!n){ui.flash='fill in at least one complete set before committing';render();return;}
    const now=new Date();
    S.sessions.push({ts:now.getTime(),date:now.toLocaleDateString(undefined,{day:'2-digit',month:'short'}),
      day:d.id,entries,notes:S.notes||''});
    delete S.draft[d.id];S.notes='';S.day=nextDayId();stopTimer();
    ui.flash='committed — '+n+' sets. next up: '+dayById(S.day).label.toLowerCase();
    save();render();scrollTo({top:0,behavior:'smooth'});
  });

  document.querySelectorAll('.wkrow .head').forEach(h=>h.addEventListener('click',()=>{
    const t=Number(h.dataset.t);ui.openSession=ui.openSession===t?null:t;
    document.getElementById('hist').innerHTML=histHTML();wire();}));
  document.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const ts=Number(b.dataset.del),s=S.sessions.find(x=>x.ts===ts);
    if(!s)return;
    if(!confirm('Delete this '+(dayById(s.day)||{label:''}).label+' session from '+s.date+'?'))return;
    S.sessions=S.sessions.filter(x=>x.ts!==ts);save();ui.flash='session deleted';render();}));
}

load();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
